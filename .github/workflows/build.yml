name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 引擎状态机自检
        run: python campus_login.py --selftest
      - name: 图形界面构建自检
        run: python gui.py --selfcheck

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装构建依赖
        run: pip install pyinstaller pywin32
      - name: 构建单文件 exe（图标随包）
        run: pyinstaller --noconfirm --onefile --noconsole --name CampusAutoLogin --icon assets/tray.ico --add-data "assets/tray.ico;assets" gui.py
      - name: 生成构建清单（产物身份）
        shell: pwsh
        run: |
          $sha = (Get-FileHash dist/CampusAutoLogin.exe -Algorithm SHA256).Hash.ToLower()
          $src = @{}
          foreach ($f in 'campus_login.py','gui.py','tray_icon.py','assets/tray.ico') {
            $src[$f] = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          }
          $m = [ordered]@{
            artifact = 'CampusAutoLogin.exe'
            sha256 = $sha
            size_bytes = (Get-Item dist/CampusAutoLogin.exe).Length
            built_at = (Get-Date).ToString('s')
            source = $env:GITHUB_SHA
            toolchain = [ordered]@{ python = (python --version); pyinstaller = (pyinstaller --version) }
            source_sha256 = $src
            checks = [ordered]@{ engine_selftest = 'PASS'; gui_selfcheck = 'PASS' }
          }
          $m | ConvertTo-Json -Depth 5 | Set-Content dist/build_info.json -Encoding UTF8
          Get-Content dist/build_info.json
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CampusAutoLogin
          path: |
            dist/CampusAutoLogin.exe
            dist/build_info.json
      - name: 发布到 GitHub Releases（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CampusAutoLogin.exe
            dist/build_info.json
          generate_release_notes: true
